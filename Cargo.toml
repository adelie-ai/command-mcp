[package]
name = "command-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Shared MCP core: JSON-RPC dispatch, stdio/websocket/unix transports, the Clap
# `serve` CLI, and (via the `auth` feature) websocket Bearer-token validation
# (HS256 secret / JWKS / OIDC discovery). The `auth` feature implies `websocket`.
mcp-core = { git = "https://github.com/adelie-ai/mcp-core", features = ["auth"] }
clap = { version = "4.5.54", features = ["derive", "env"] }
nix = { version = "0.30.1", features = ["process", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8.22", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.49", features = ["full"] }
toml = "0.9.11"
# Spans, events and metrics on this server's own execution path (the command
# spawn boundary and the tool-call handler). Already in the tree through
# mcp-core -> adelie-telemetry, so naming it directly adds no crate.
tracing = "0.1.44"

[dev-dependencies]
# Used by the websocket-auth integration test to mint HS256 tokens, by the
# stdio/websocket end-to-end tests for temp configs, and by the websocket client.
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["rust_crypto", "use_pem"] }
tempfile = "3.24"
tokio-tungstenite = "0.26"
futures-util = "0.3.31"
# A capturing `Layer` for the telemetry acceptance tests: they read back the
# spans and events the dispatch and execution paths really produced. Already
# in the tree through adelie-telemetry, so this adds no crate.
tracing-subscriber = "0.3.23"

[features]
# OTLP export of traces, metrics and log records, passed through to mcp-core
# (which passes it through to adelie-telemetry). Off by default: with it off
# no opentelemetry crate is resolved at all, and console logging plus the
# in-process metrics summary work unchanged. Configure with the standard
# `OTEL_*` environment variables (see the README's Logging section).
otel = ["mcp-core/otel"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

# Release profiles. Default favors small, fast binaries (strip + thin LTO).
# Build variants: `cargo build --profile release-fast` / `--profile release-small`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.release-fast]
inherits = "release"
lto = "fat"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
